# Server-Version (Ubuntu + Docker), hinter TLS-terminierendem Reverse-Proxy
# (Tailscale Funnel: extern HTTPS, intern HTTP + X-Forwarded-Proto: https).
#
# Start auf dem Server:
#   docker compose -f docker-compose.server.yml --env-file .env up -d --build
# Update:
#   git pull && docker compose -f docker-compose.server.yml --env-file .env up -d --build
#
# Host-Ports sind parametrisierbar (Defaults in Klammern):
#   WEB_PORT (3000)  ·  N8N_PORT (5678)
name: hk-cockpit

services:
  postgres:
    image: postgres:16-alpine
    container_name: hk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cockpit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bitte in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-cockpit}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # KEIN ports: — die DB bleibt im internen Docker-Netz, von außen unerreichbar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cockpit} -d ${POSTGRES_DB:-cockpit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    container_name: hk-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cockpit}:${POSTGRES_PASSWORD:?bitte in .env setzen}@postgres:5432/${POSTGRES_DB:-cockpit}
      AUTH_SECRET: ${AUTH_SECRET:?bitte in .env setzen}
      # Rückkanal /api/automations/log: n8n-Workflows melden Läufe ans Cockpit.
      # Ohne Wert bleibt der Endpoint in Produktion geschlossen (503). openssl rand -hex 32
      AUTOMATION_INGEST_SECRET: ${AUTOMATION_INGEST_SECRET:-}
      NODE_ENV: production
      # Ablage der Buchhaltungsbelege (GoBD: unveränderbar aufbewahren).
      BELEG_PFAD: /data/belege
      # Adresse der n8n-Instanz — nötig für den "Jetzt starten"-Knopf bei den
      # Automationen. Ohne Wert bleibt der Knopf aus (mit Hinweis in der App).
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      # KI-Assistent — OPTIONAL. Ohne Schlüssel läuft das Dashboard normal,
      # nur Chat-Assistent + Drive-Import sind deaktiviert.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # Google Drive — OPTIONAL. Ohne Werte zeigt /drive "nicht eingerichtet".
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Muss EXAKT der öffentlichen Funnel-URL + /api/google/callback entsprechen.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # ── Zentrale (siehe ZENTRALE.md) ─────────────────────────────────────
      # Öffentliche Adresse des Cockpits — für die Ereignis-Adressen der Apps.
      COCKPIT_URL: ${COCKPIT_URL:-}
      # Adresse der n8n-Oberfläche für Link und Statusanzeige (sonst N8N_BASE_URL).
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:-}
      # Schlüssel für gespeicherte Geheimnisse (SMTP-Passwörter, Ereignis-Geheimnisse).
      # Fehlt er, wird er aus AUTH_SECRET abgeleitet. Später nicht mehr ändern.
      ZENTRALE_SECRET_KEY: ${ZENTRALE_SECRET_KEY:-}
      # Schützt POST /api/zentrale/takt (verzögerte Mail-Automationen).
      ZENTRALE_TAKT_SECRET: ${ZENTRALE_TAKT_SECRET:-}
      # GitHub nur lesend; alternativ in der App unter Einstellungen hinterlegen.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optionales Postfach aus der Umgebung (gilt, solange in der App keins eingerichtet ist).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HK Growth Operator}
    volumes:
      # Belegarchiv der Buchhaltung — Named Volume, damit die Dateien einen
      # Neubau des Containers überleben.
      - beleg_archiv:/data/belege
    ports:
      - "${WEB_PORT:-3000}:3000" # Funnel terminiert TLS extern und proxyt hierher

volumes:
  beleg_archiv:

